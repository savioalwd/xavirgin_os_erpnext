{% extends "templates/web.html" %}
{% block title %}Careers & Remote Internship Portal — Xavirgin{% endblock %}

{% block page_content %}
<div class="container py-5" style="max-width: 820px;">
	<div class="p-4 mb-4 rounded shadow-sm text-white" style="background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);">
		<h2 class="mb-1 text-white font-weight-bold">🧬 XAVIRGIN CAREERS & INTERNSHIP PORTAL</h2>
		<p class="mb-0" style="opacity: 0.9;">Apply directly for open Engineering, UI/UX, QA, and Operations tracks.</p>
	</div>

	<div class="card shadow-sm border-0 p-4">
		<form id="xav-application-form">
			<div class="form-group">
				<label class="font-weight-bold">Select Job Opening *</label>
				<select class="form-control" id="job_opening" required>
					{% for j in jobs %}
					<option value="{{ j.name }}" {% if selected_job and selected_job.name == j.name %}selected{% endif %}>
						{{ j.job_title }} ({{ j.department }} — {{ j.employment_type }})
					</option>
					{% endfor %}
				</select>
			</div>

			<div class="row">
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">Full Name *</label>
					<input type="text" class="form-control" id="full_name" required placeholder="e.g. Joshva Jashper W">
				</div>
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">Email Address *</label>
					<input type="email" class="form-control" id="email" required placeholder="you@example.com">
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">Phone / WhatsApp Number *</label>
					<input type="text" class="form-control" id="phone" required placeholder="+91 98765 43210">
				</div>
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">City, State & Country *</label>
					<input type="text" class="form-control" id="location" required placeholder="Kochi, Kerala, India">
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">Highest Education / College</label>
					<input type="text" class="form-control" id="education" placeholder="B.Tech CSE / BCA / MCA">
				</div>
				<div class="col-md-6 form-group">
					<label class="font-weight-bold">Primary Technical Skills</label>
					<input type="text" class="form-control" id="skills" placeholder="Flutter, Dart, React, Python, Figma, QA">
				</div>
			</div>

			<div class="row">
				<div class="col-md-4 form-group">
					<label class="font-weight-bold">GitHub URL</label>
					<input type="url" class="form-control" id="github_url" placeholder="https://github.com/...">
				</div>
				<div class="col-md-4 form-group">
					<label class="font-weight-bold">LinkedIn URL</label>
					<input type="url" class="form-control" id="linkedin_url" placeholder="https://linkedin.com/in/...">
				</div>
				<div class="col-md-4 form-group">
					<label class="font-weight-bold">Portfolio / Resume Link</label>
					<input type="url" class="form-control" id="portfolio_url" placeholder="https://...">
				</div>
			</div>

			<div class="form-group">
				<label class="font-weight-bold">Experience & Project Summary</label>
				<textarea class="form-control" id="experience_summary" rows="3" placeholder="Briefly describe projects you have built..."></textarea>
			</div>

			<button type="submit" class="btn btn-primary btn-lg btn-block mt-3" style="background:#4c1d95; border:none;">
				🚀 Submit Official Application
			</button>
		</form>
		<div id="xav-app-result" class="mt-3" style="display:none;"></div>
	</div>
</div>

<script>
frappe.ready(function() {
	$("#xav-application-form").on("submit", function(e) {
		e.preventDefault();
		frappe.call({
			method: "xavirgin_os.api.apply_for_job",
			args: {
				job_opening: $("#job_opening").val(),
				full_name: $("#full_name").val(),
				email: $("#email").val(),
				phone: $("#phone").val(),
				location: $("#location").val(),
				education: $("#education").val(),
				skills: $("#skills").val(),
				github_url: $("#github_url").val(),
				linkedin_url: $("#linkedin_url").val(),
				portfolio_url: $("#portfolio_url").val(),
				experience_summary: $("#experience_summary").val()
			},
			freeze: true,
			freeze_message: "Submitting your application...",
			callback: function(r) {
				if (r.message && r.message.status === "success") {
					$("#xav-application-form").hide();
					$("#xav-app-result").html(
						`<div class="alert alert-success">
							<h4>✅ Application Received!</h4>
							<p>${r.message.message}</p>
							<p><b>Candidate Reference ID:</b> <code>${r.message.candidate_id}</code></p>
						</div>`
					).show();
				}
			}
		});
	});
});
</script>
{% endblock %}
